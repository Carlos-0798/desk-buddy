<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="t d"><title id="t">Desk Buddy system architecture</title><desc id="d">Inputs feed the nRF52840, which sends HID through one selected route to the host. The Windows Hub uses a separate bidirectional USB CDC or authorized BLE GATT management path.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b88ff"/></marker></defs><rect width="1080" height="360" rx="10" fill="#101c39"/><g font-family="Arial,sans-serif" fill="#fff"><g fill="#203259" stroke="#445779"><rect x="28" y="36" width="234" height="144" rx="8"/><rect x="338" y="36" width="328" height="144" rx="8"/><rect x="742" y="36" width="310" height="144" rx="8"/><rect x="338" y="238" width="328" height="87" rx="8"/></g><g font-size="22" font-weight="bold"><text x="50" y="75">Physical inputs</text><text x="360" y="75">nRF52840 firmware</text><text x="765" y="75">Host media / keys</text><text x="360" y="272">Windows Hub</text></g><g font-size="16" fill="#c6d3ef"><text x="50" y="110">6 keys · encoder · touch</text><text x="50" y="144">TFT + animated companion</text><text x="360" y="110">Mappings → readiness → output</text><text x="360" y="144">USB or BLE HID · one route</text><text x="765" y="110">Volume · mute · playback</text><text x="765" y="144">Keyboard actions</text><text x="360" y="303">Profiles · appearance · diagnostics</text></g><g stroke="#6b88ff" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M266 108H328"/><path d="M670 108H732"/><path d="M502 234V190" marker-start="url(#a)"/></g><g font-size="15" fill="#ffe26b"><text x="528" y="212">USB CDC / authorized BLE GATT</text><text x="28" y="295">Input / output path</text><text x="741" y="295">Separate management path</text></g></g></svg>
